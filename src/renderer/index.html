<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <title>Sonar</title>
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/visual.css" />
</head>

<body>

    <!-- ======================================================================
         UPGRADE PAGE — shown when "Upgrade to Pro" is triggered from
         anywhere (file-nav footer button, any future data-tier="pro"
         upsell). Own top-level root, same pattern as onboarding-root.
         ====================================================================== -->
    <div class="upgrade-page" id="upgrade-page-root">
        <header class="upgrade-page__header">
            <div class="upgrade-page__brand">
                <span class="upgrade-page__logo" aria-hidden="true"></span>
                <span class="upgrade-page__brand-name">Sonar</span>
            </div>
            <button class="upgrade-page__back" type="button" data-action="back-to-app">
                Back to app
            </button>
        </header>

        <div class="upgrade-page__hero">
            <h1 class="upgrade-page__heading">Upgrade Your Reading Experience</h1>
            <p class="upgrade-page__subheading">
                Ditch the screen. Turn your reading list into an immersive podcast feed natively.
            </p>
            <p class="upgrade-page__payment-note">
                Powered by Paystack. Secure processing guaranteed.
                <br />
                <button class="upgrade-page__cancel-link" type="button" data-action="cancel-subscription-info">
                    Cancel subscription anytime in settings.
                </button>
            </p>
        </div>

        <div class="upgrade-page__plans" id="upgrade-page-plans-slot">
            <!-- plan cards injected by app.js from state.plans -->
        </div>
    </div>

    <!-- ======================================================================
         ONBOARDING — shown before the app shell on first run. Own top-level
         container (not part of app-shell) since there's no file-nav to
         anchor to yet. app.js toggles which of these two roots is visible.
         ====================================================================== -->
    <div class="onboarding-root" id="onboarding-root">
        <div id="onboarding-step-slot" data-slot="onboarding-step"></div>
    </div>

    <!-- ======================================================================
         APP SHELL — persistent slots. file-nav-slot mounts once and is never
         re-rendered. main-slot / player-panel-slot / mini-player-slot swap
         based on app state (see app.js).
         ====================================================================== -->
    <div class="app-shell" id="app-shell">
        <div id="file-nav-slot" data-slot="file-nav"></div>
        <div id="main-slot" data-slot="main"></div>
        <div id="player-panel-slot" data-slot="player-panel"></div>
        <div id="mini-player-slot" data-slot="mini-player"></div>
    </div>

    <!-- ======================================================================
         UPGRADE PAGE TEMPLATES
         ====================================================================== -->

    <!-- ---------- PLAN CARD (reused for both Free and Pro) ---------- -->
    <template id="tpl-plan-card">
        <article class="plan-card" data-plan="">
            <div class="plan-card__header">
                <h2 class="plan-card__name" data-bind="planName"></h2>
                <span class="plan-card__badge" data-bind="planBadge"></span>
            </div>

            <p class="plan-card__price">
                <span class="plan-card__price-amount" data-bind="priceAmount"></span>
                <span class="plan-card__price-period" data-bind="pricePeriod"></span>
            </p>

            <p class="plan-card__description" data-bind="planDescription"></p>

            <hr class="plan-card__divider" />

            <ul class="plan-card__feature-list" data-list="features">
                <!-- feature items injected by app.js -->
            </ul>

            <button class="plan-card__cta" type="button" data-action="plan-cta"></button>
        </article>
    </template>

    <!-- ---------- FEATURE LIST ITEM (cloned per feature into a plan card) ---------- -->
    <template id="tpl-plan-feature">
        <li class="plan-card__feature">
            <span class="plan-card__feature-icon" aria-hidden="true"></span>
            <span class="plan-card__feature-text" data-bind="featureText"></span>
        </li>
    </template>

    <!-- ======================================================================
         ONBOARDING TEMPLATES
         ====================================================================== -->

    <!-- ---------- STEP 1: NAME ---------- -->
    <template id="tpl-onboarding-name">
        <section class="onboarding-step" data-step="name">
            <p class="onboarding-step__progress">Step 1 of 3</p>

            <h1 class="onboarding-step__heading">What should we call you?</h1>
            <p class="onboarding-step__subheading">This is how Sonar will greet you.</p>

            <div class="onboarding-step__field">
                <label class="onboarding-step__label" for="onboarding-name-input">Your name</label>
                <input class="onboarding-step__input" type="text" id="onboarding-name-input" placeholder="Alex"
                    data-bind="nameInput" />
            </div>

            <div class="onboarding-step__actions">
                <button class="onboarding-step__button onboarding-step__button--primary" type="button"
                    data-action="next">
                    Continue
                </button>
            </div>
        </section>
    </template>

    <!-- ---------- STEP 2: PREFERENCES ---------- -->
    <template id="tpl-onboarding-preferences">
        <section class="onboarding-step" data-step="preferences">
            <p class="onboarding-step__progress">Step 2 of 3</p>

            <h1 class="onboarding-step__heading">Set up your preferences</h1>
            <p class="onboarding-step__subheading">You can change these anytime in settings.</p>

            <div class="onboarding-step__field">
                <span class="onboarding-step__label">Voice</span>
                <div class="onboarding-step__option-group" data-group="voiceGender">
                    <label class="onboarding-step__option">
                        <input type="radio" name="voiceGender" value="female" data-bind="voiceGenderFemale" />
                        Female
                    </label>
                    <label class="onboarding-step__option">
                        <input type="radio" name="voiceGender" value="male" data-bind="voiceGenderMale" />
                        Male
                    </label>
                </div>
            </div>

            <div class="onboarding-step__field">
                <span class="onboarding-step__label">Theme</span>
                <div class="onboarding-step__option-group" data-group="theme">
                    <label class="onboarding-step__option">
                        <input type="radio" name="theme" value="light" data-bind="themeLight" />
                        Light
                    </label>
                    <label class="onboarding-step__option">
                        <input type="radio" name="theme" value="dark" data-bind="themeDark" />
                        Dark
                    </label>
                </div>
            </div>

            <div class="onboarding-step__field">
                <span class="onboarding-step__label">Accent color</span>
                <div class="onboarding-step__swatch-group" data-group="accentColor">
                    <!-- swatch buttons injected by app.js from ACCENT_COLOR_OPTIONS -->
                </div>
            </div>

            <div class="onboarding-step__actions">
                <button class="onboarding-step__button" type="button" data-action="back">Back</button>
                <button class="onboarding-step__button onboarding-step__button--primary" type="button"
                    data-action="next">
                    Continue
                </button>
            </div>
        </section>
    </template>

    <!-- ---------- ACCENT COLOR SWATCH (cloned per option) ---------- -->
    <template id="tpl-onboarding-swatch">
        <button class="onboarding-step__swatch" type="button" data-bind="swatchValue"></button>
    </template>

    <!-- ---------- STEP 3: LICENSE ---------- -->
    <template id="tpl-onboarding-license">
        <section class="onboarding-step" data-step="license">
            <p class="onboarding-step__progress">Step 3 of 3</p>

            <h1 class="onboarding-step__heading">Activate Pro?</h1>
            <p class="onboarding-step__subheading">
                If you have a Sonar Pro license, activate it now. Otherwise, continue with the free plan —
                you can activate later from settings.
            </p>

            <div class="onboarding-step__field">
                <label class="onboarding-step__label" for="onboarding-license-input">License file</label>
                <div class="onboarding-step__file-row">
                    <input class="onboarding-step__input" type="text" id="onboarding-license-input"
                        placeholder="No file selected" readonly data-bind="licensePathDisplay" />
                    <button class="onboarding-step__button" type="button" data-action="browse-license">Browse</button>
                </div>
                <p class="onboarding-step__field-status" data-bind="licenseStatus"></p>
            </div>

            <div class="onboarding-step__actions">
                <button class="onboarding-step__button" type="button" data-action="back">Back</button>
                <button class="onboarding-step__button" type="button" data-action="skip">Skip, continue free</button>
                <button class="onboarding-step__button onboarding-step__button--primary" type="button"
                    data-action="activate-and-finish">
                    Activate &amp; finish
                </button>
            </div>
        </section>
    </template>

    <!-- ======================================================================
         MAIN APP TEMPLATES
         ====================================================================== -->

    <!-- ---------- FILE NAV (shared, identical on every screen) ---------- -->
    <template id="tpl-file-nav">
        <aside class="file-nav">
            <div class="file-nav__brand">
                <span class="file-nav__logo" aria-hidden="true">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="24" height="24" rx="12" fill="#3B82F6" />
                        <rect width="24" height="24" rx="12" fill="url(#paint0_linear_356_1831)" />
                        <g clip-path="url(#clip0_356_1831)">
                            <path
                                d="M6 10.6667V12.6667M8.4 8V15.3333M10.8 6V18M13.2 9.33333V14M15.6 7.33333V16M18 10.6667V12.6667"
                                stroke="#F8FAFC" stroke-width="2" stroke-linecap="round" />
                        </g>
                        <defs>
                            <linearGradient id="paint0_linear_356_1831" x1="0" y1="0" x2="24" y2="0"
                                gradientUnits="userSpaceOnUse">
                                <stop stop-color="#3B82F6" />
                                <stop offset="1" stop-color="#9333EA" />
                            </linearGradient>
                            <clipPath id="clip0_356_1831">
                                <rect width="12" height="12" fill="white" transform="translate(6 6)" />
                            </clipPath>
                        </defs>
                    </svg>

                </span>
                <span class="file-nav__name">Sonar</span>
                <button class="file-nav__pin-toggle" type="button" aria-label="Pin sidebar open">
                    <span class="file-nav__pin-icon" aria-hidden="true"></span>
                </button>
            </div>

            <div class="file-nav__search">
                <input type="search" class="file-nav__search-input" placeholder="Search files..." />
            </div>

            <button class="file-nav__new-file" type="button" data-action="new-file">
                <span class="file-nav__new-file-icon" aria-hidden="true">
                    <svg width="12" height="11" viewBox="0 0 12 11" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 10V5.5M6 5.5V1M6 5.5H11M6 5.5H1" stroke="#94A3B8" stroke-width="2"
                            stroke-linecap="round" />
                    </svg>

                </span>
                <span class="file-nav__new-file-label">New file</span>
            </button>

            <nav class="file-nav__section" aria-label="Pinned files">
                <h2 class="file-nav__section-label">Pinned</h2>
                <ul class="file-nav__list" data-list="pinned">
                    <!-- file items injected by app.js from state.pinnedFiles -->
                </ul>
            </nav>

            <nav class="file-nav__section" aria-label="Recent files">
                <h2 class="file-nav__section-label">Recents</h2>
                <ul class="file-nav__list" data-list="recents">
                    <!-- file items injected by app.js from state.recentFiles -->
                </ul>
            </nav>

            <div class="file-nav__footer">
                <button class="file-nav__upgrade" type="button" data-tier="pro-upsell" data-action="upgrade-to-pro">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <g clip-path="url(#clip0_356_2098)">
                            <path
                                d="M11.6673 1.16715V3.5004M12.8341 2.33378H10.5005M6.42678 1.64223C6.45177 1.50842 6.52279 1.38756 6.62752 1.30059C6.73225 1.21362 6.8641 1.16602 7.00024 1.16602C7.13638 1.16602 7.26823 1.21362 7.37296 1.30059C7.47769 1.38756 7.54871 1.50842 7.5737 1.64223L8.18684 4.88427C8.23038 5.11476 8.34241 5.32678 8.50829 5.49264C8.67418 5.65851 8.88622 5.77052 9.11674 5.81406L12.3592 6.42712C12.493 6.45212 12.6139 6.52312 12.7008 6.62784C12.7878 6.73256 12.8354 6.86439 12.8354 7.00052C12.8354 7.13664 12.7878 7.26848 12.7008 7.37319C12.6139 7.47791 12.493 7.54892 12.3592 7.57391L9.11674 8.18697C8.88622 8.23051 8.67418 8.34252 8.50829 8.50839C8.34241 8.67426 8.23038 8.88627 8.18684 9.11677L7.5737 12.3588C7.54871 12.4926 7.47769 12.6135 7.37296 12.7004C7.26823 12.7874 7.13638 12.835 7.00024 12.835C6.8641 12.835 6.73225 12.7874 6.62752 12.7004C6.52279 12.6135 6.45177 12.4926 6.42678 12.3588L5.81364 9.11677C5.7701 8.88627 5.65807 8.67426 5.49218 8.50839C5.3263 8.34252 5.11426 8.23051 4.88374 8.18697L1.64131 7.57391C1.50748 7.54892 1.38661 7.47791 1.29963 7.37319C1.21265 7.26848 1.16504 7.13664 1.16504 7.00052C1.16504 6.86439 1.21265 6.73256 1.29963 6.62784C1.38661 6.52312 1.50748 6.45212 1.64131 6.42712L4.88374 5.81406C5.11426 5.77052 5.3263 5.65851 5.49218 5.49264C5.65807 5.32678 5.7701 5.11476 5.81364 4.88427L6.42678 1.64223ZM3.49998 11.6667C3.49998 12.311 2.97761 12.8334 2.33322 12.8334C1.68884 12.8334 1.16646 12.311 1.16646 11.6667C1.16646 11.0224 1.68884 10.5001 2.33322 10.5001C2.97761 10.5001 3.49998 11.0224 3.49998 11.6667Z"

                        </g>
                        <defs>
                            <clipPath id="clip0_356_2098">
                                <rect width="14" height="14" fill="white" />
                            </clipPath>
                        </defs>
                    </svg>

                    <span class="file-nav__upgrade-label">Upgrade to Pro</span>
                </button>

                <div class="file-nav__account">
                    <span class="file-nav__avatar" aria-hidden="true"></span>
                    <div class="file-nav__account-info">
                        <span class="file-nav__account-name">Alexander Chen</span>
                        <span class="file-nav__account-email">Free</span>
                    </div>
                    <button class="file-nav__settings" type="button" aria-label="Settings">
                        <span class="file-nav__settings-icon" aria-hidden="true">
                            <svg width="19" height="18" viewBox="0 0 19 18" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M12.0994 8.62443C12.0994 10.2853 10.7675 11.6317 9.12441 11.6317C7.48136 11.6317 6.14941 10.2853 6.14941 8.62443C6.14941 6.96357 7.48136 5.61719 9.12441 5.61719C10.7675 5.61719 12.0994 6.96357 12.0994 8.62443Z"

                            </svg>

                        </span>
                    </button>
                </div>
            </div>
        </aside>
    </template>

    <!-- ---------- FILE NAV LIST ITEM (cloned per file into the lists above) ---------- -->
    <template id="tpl-file-nav-item">
        <li class="file-nav__item">
            <button class="file-nav__item-button" type="button">
                <span class="file-nav__item-icon" aria-hidden="true">
                    <svg class="h-3.5 w-3.5 shrink-0 text-gray-400" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 17v5"></path>
                        <path
                            d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 0-1-1H10a1 1 0 0 0-1 1z">
                        </path>
                    </svg>
                </span>
                <span class="file-nav__item-name" data-bind="fileName"></span>
            </button>
        </li>
    </template>


    <template id="tpl-recent-file-nav-item">
        <li class="file-nav__item">
            <button class="file-nav__item-button" type="button">
                <span class="file-nav__item-icon" aria-hidden="true">
                    <svg class="h-3.5 w-3.5 shrink-0 text-gray-400" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <path d="M14 2v6h6"></path>
                        <path d="M16 13H8"></path>
                        <path d="M16 17H8"></path>
                        <path d="M10 9H8"></path>
                    </svg>
                </span>
                <span class="file-nav__item-name" data-bind="fileName"></span>
            </button>
        </li>
    </template>

    <!-- ---------- EMPTY STATE (center slot — no document loaded) ---------- -->
    <template id="tpl-empty-state">
        <main class="empty-state">
            <div class="empty-state__toolbar">
                <button class="empty-state__theme-toggle" type="button" aria-label="Toggle theme"
                    data-action="toggle-theme">
                    <span class="empty-state__theme-icon" aria-hidden="true"></span>
                </button>
            </div>

            <div class="empty-state__content">
                <div class="empty-state__orb-wrap">
                    <video src="./assets/orb/orb-2.webm" autoplay loop width="300" height="300"></video>
                </div>

                <h1 class="empty-state__heading">
                    Welcome, <span data-bind="firstName">Alex</span>
                </h1>
                <p class="empty-state__subheading">What document would you like to work with?</p>

                <div class="empty-state__dropzone" data-action="dropzone">
                    <div class="empty-state__dropzone-icon" aria-hidden="true">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M10.0003 10.8331V17.5M13.3335 14.1665L10.0003 10.8331L6.6672 14.1665M3.33434 12.4159C2.71524 11.7833 2.2482 11.0181 1.96861 10.1782C1.68901 9.3384 1.60419 8.44594 1.72056 7.56846C1.83693 6.69099 2.15145 5.8515 2.64029 5.11359C3.12913 4.37568 3.77946 3.7587 4.54205 3.30938C5.30463 2.86007 6.15945 2.5902 7.04177 2.52021C7.92408 2.45023 8.81076 2.58197 9.63462 2.90546C10.4585 3.22895 11.1979 3.73569 11.797 4.38732C12.396 5.03894 12.8389 5.81836 13.0921 6.66652H14.5837C15.3883 6.66643 16.1715 6.92513 16.8177 7.40441C17.464 7.88369 17.9389 8.55813 18.1725 9.3281C18.406 10.0981 18.3857 10.9228 18.1146 11.6803C17.8435 12.4379 17.3359 13.0881 16.6669 13.5351"
                                stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
                        </svg>
                    </div>
                    <p class="empty-state__dropzone-title">Upload a PDF to get started</p>
                    <p class="empty-state__dropzone-hint">
                        Drag and drop or
                        <button class="empty-state__browse-link" type="button" data-action="browse-files">Browse
                            files</button>
                    </p>
                    <p class="empty-state__dropzone-constraint">Supports .pdf files up to 25MB.</p>
                </div>
            </div>
        </main>
    </template>

    <!-- ---------- READER VIEW (center slot — document loaded) ---------- -->
    <template id="tpl-reader-view">
        <main class="reading-pane">
            <div class="reading-pane__toolbar">
                <button class="reading-pane__theme-toggle" type="button" aria-label="Toggle theme"
                    data-action="toggle-theme">
                    <span class="reading-pane__theme-icon" aria-hidden="true"></span>
                </button>
            </div>

            <article class="reading-pane__document">
                <h1 class="reading-pane__title" data-bind="documentTitle"></h1>

                <div class="reading-pane__body" data-bind="documentBody">
                    <!-- paragraphs injected by app.js from state.currentDocument -->
                </div>
            </article>
        </main>
    </template>

    <template id="tpl-player-panel-generate">
        <aside class="player-panel">
            <h2 class="player-panel__heading">Currently Reading</h2>

             <div class="player-panel__orb-wrap">
                <video src="./assets/orb/orb-2.webm" autoplay width="250" height="250" loop></video>
            </div>


            <p class="player-panel__narrator">
                Narrator: <span class="player-panel__narrator-name" data-bind="narratorName"></span>
            </p>

            <div class="player-panel__voice-picker">
                <label class="player-panel__voice-picker-label" for="voice-select">Choose a voice</label>
                <select class="player-panel__voice-select" id="voice-select" data-bind="voiceSelect"></select>
            </div>
            <button class="player-panel__generate-button" type="button" data-action="generate-audio">
                Generate audio
            </button>
        </aside>
    </template>


    <template id="tpl-voice-list-item">
        <li class="player-panel__voice-item" data-tier="">
            <button class="player-panel__voice-button" type="button">
                <span class="player-panel__voice-name" data-bind="voiceName"></span>
                <span class="player-panel__voice-meta" data-bind="voiceMeta"></span>
                <span class="player-panel__voice-lock" aria-hidden="true"></span>
            </button>
        </li>
    </template>



    <!-- ---------- PLAYER PANEL: READY (audio generated) ---------- -->
    <template id="tpl-player-panel-ready">
        <aside class="player-panel">
            <h2 class="player-panel__heading">Currently Reading</h2>

            <div class="player-panel__orb-wrap">
                <video src="./assets/orb/orb-2.webm" autoplay width="250" height="250" loop></video>
            </div>

            <p class="player-panel__narrator">
                Narrator: <span class="player-panel__narrator-name" data-bind="narratorName"></span>
            </p>

            <div class="player-panel__toolbar">
                <button class="player-panel__speed" type="button" data-action="cycle-speed"
                    data-bind="speedLabel">1x</button>
                <button class="player-panel__volume-button" type="button" aria-label="Volume" data-action="volume">
                    <span class="player-panel__volume-icon" aria-hidden="true">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M9.3332 5.24977C9.71187 5.75462 9.91657 6.36867 9.91657 6.99973C9.91657 7.6308 9.71187 8.24484 9.3332 8.74969M11.2958 10.7118C11.7834 10.2243 12.1701 9.64559 12.434 9.00864C12.6978 8.37169 12.8336 7.68901 12.8336 6.99958C12.8336 6.31015 12.6978 5.62747 12.434 4.99052C12.1701 4.35357 11.7834 3.77483 11.2958 3.28733M6.41635 2.74268C6.41623 2.66143 6.39205 2.58203 6.34685 2.51452C6.30165 2.447 6.23746 2.39438 6.16238 2.3633C6.0873 2.33223 6.0047 2.32408 5.925 2.3399C5.8453 2.35572 5.77207 2.39479 5.71455 2.45218L3.74043 4.42556C3.66424 4.50219 3.5736 4.56295 3.47377 4.6043C3.37393 4.64565 3.26687 4.66678 3.15881 4.66647H1.74939C1.59467 4.66647 1.44628 4.72792 1.33688 4.83732C1.22748 4.94671 1.16602 5.09508 1.16602 5.24979V8.74971C1.16602 8.90441 1.22748 9.05278 1.33688 9.16218C1.44628 9.27157 1.59467 9.33303 1.74939 9.33303H3.15881C3.26687 9.33271 3.37393 9.35384 3.47377 9.3952C3.5736 9.43655 3.66424 9.4973 3.74043 9.57394L5.71397 11.5479C5.77149 11.6055 5.84482 11.6448 5.92468 11.6607C6.00453 11.6766 6.08732 11.6685 6.16254 11.6373C6.23776 11.6061 6.30203 11.5533 6.34722 11.4856C6.3924 11.4179 6.41646 11.3382 6.41635 11.2568V2.74268Z"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        </svg>
                    </span>
                </button>
                <input class="player-panel__volume-slider" type="range" min="0" max="100" aria-label="Volume level"
                    data-bind="volume" />
            </div>

            <div class="player-panel__scrubber">
                <div class="player-panel__time player-panel__time--elapsed" data-bind="timeElapsed"></div>
                <div class="player-panel__time player-panel__time--total" data-bind="timeTotal"></div>
                <input class="player-panel__progress" type="range" min="0" max="100" aria-label="Playback position"
                    data-bind="progress" />
            </div>

            <div class="player-panel__transport">
                <button class="player-panel__transport-button" type="button" aria-label="Rewind" data-action="rewind">
                    <span class="player-panel__transport-icon player-panel__transport-icon--rewind" aria-hidden="true">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M5.24999 2.33398L2.33362 5.25036L5.24999 8.16673M2.33362 5.25036H8.458C9.30882 5.25036 10.1248 5.58835 10.7264 6.18996C11.328 6.79158 11.666 7.60755 11.666 8.45837C11.666 8.87965 11.583 9.29681 11.4218 9.68602C11.2606 10.0752 11.0243 10.4289 10.7264 10.7268C10.1248 11.3284 9.30882 11.6664 8.458 11.6664H6.41654"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        </svg>
                    </span>
                </button>
                <button class="player-panel__transport-button" type="button" aria-label="Skip forward"
                    data-action="skip-forward">
                    <span class="player-panel__transport-icon player-panel__transport-icon--forward" aria-hidden="true">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M5.24999 2.33398L2.33362 5.25036L5.24999 8.16673M2.33362 5.25036H8.458C9.30882 5.25036 10.1248 5.58835 10.7264 6.18996C11.328 6.79158 11.666 7.60755 11.666 8.45837C11.666 8.87965 11.583 9.29681 11.4218 9.68602C11.2606 10.0752 11.0243 10.4289 10.7264 10.7268C10.1248 11.3284 9.30882 11.6664 8.458 11.6664H6.41654"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        </svg>
                    </span>
                </button>
                <button class="player-panel__transport-button player-panel__transport-button--primary" type="button"
                    aria-label="Play/pause" data-action="play-pause">
                    <span class="player-panel__transport-icon" aria-hidden="true"></span>
                </button>
                <button class="player-panel__transport-button" type="button" aria-label="Regenerate"
                    data-action="regenerate">
                    <span class="player-panel__transport-icon" aria-hidden="true"></span>
                </button>
            </div>
        </aside>
    </template>




    <!-- ---------- MINI PLAYER (bottom slot — only when a document is loaded) ---------- -->
    <template id="tpl-mini-player">
        <footer class="mini-player">
            <button class="mini-player__play-button" type="button" aria-label="Play/pause" data-action="play-pause">
                <span class="mini-player__play-icon" aria-hidden="true"></span>
            </button>

            <div class="mini-player__info">
                <span class="mini-player__filename" data-bind="fileName"></span>
                <span class="mini-player__meta" data-bind="fileMeta"></span>
            </div>

            <div class="mini-player__scrubber">
                <span class="mini-player__time mini-player__time--elapsed" data-bind="timeElapsed"></span>
                <input class="mini-player__progress" type="range" min="0" max="100" aria-label="Playback position"
                    data-bind="progress" />
                <span class="mini-player__time mini-player__time--total" data-bind="timeTotal"></span>
            </div>

            <div class="mini-player__meta-controls">
                <span class="mini-player__narrator" data-bind="narratorName"></span>
                <button class="mini-player__speed" type="button" data-bind="speedLabel"></button>
                <button class="mini-player__volume-button" type="button" aria-label="Volume" data-action="volume">
                    <span class="mini-player__volume-icon" aria-hidden="true"></span>
                </button>
            </div>
        </footer>
    </template>

    <script src="app.js"></script>
    <script src="./lib/playback.js"></script>
</body>

</html>
