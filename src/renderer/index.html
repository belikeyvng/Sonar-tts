<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <title>Sonar</title>
    <link rel="stylesheet" href="./styles/splash.css">
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/visual.css" />
</head>

<body>

    <div class="splash-screen" id="splash-screen">
        <span class="splash-screen__logo" aria-hidden="true">
            <svg width="90" height="90" viewBox="0 0 42 43" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="42" height="43" rx="21" fill="url(#paint0_linear_356_2420)" />
                <path
                    d="M9.33203 19.1667V22.6667M13.9991 14.5V27.3333M18.6661 11V32M23.3332 16.8333V25M28.0002 13.3333V28.5M32.6672 19.1667V22.6667"
                    stroke="#F8FAFC" stroke-width="2" stroke-linecap="round" />
                <defs>
                    <linearGradient id="paint0_linear_356_2420" x1="0" y1="0" x2="42" y2="0"
                        gradientUnits="userSpaceOnUse">
                        <stop stop-color="#3B82F6" />
                        <stop offset="1" stop-color="#9333EA" />
                    </linearGradient>
                </defs>
            </svg>

        </span>
    </div>

    <div class="splash-screen splash-screen--welcome" id="welcome-splash-screen" style="display: none;">
        <span class="splash-screen__logo" aria-hidden="true">
            <svg width="90" height="90" viewBox="0 0 42 43" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="42" height="43" rx="21" fill="url(#paint-logo-welcome)" />
                <path
                    d="M9.33203 19.1667V22.6667M13.9991 14.5V27.3333M18.6661 11V32M23.3332 16.8333V25M28.0002 13.3333V28.5M32.6672 19.1667V22.6667"
                    stroke="#F8FAFC" stroke-width="2" stroke-linecap="round" />
                <defs>
                    <linearGradient id="paint-logo-welcome" x1="0" y1="0" x2="42" y2="0" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#3B82F6" />
                        <stop offset="1" stop-color="#9333EA" />
                    </linearGradient>
                </defs>
            </svg>
        </span>
        <p class="splash-screen__message" id="welcome-splash-message"></p>
    </div>

    <!-- ======================================================================
         UPGRADE PAGE — shown when "Upgrade to Pro" is triggered from
         anywhere (file-nav footer button, any future data-tier="pro"
         upsell). Own top-level root, same pattern as onboarding-root.
         ====================================================================== -->
    <div class="upgrade-page" id="upgrade-page-root">
        <header class="upgrade-page__header">
            <div class="upgrade-page__brand">
                <span class="upgrade-page__logo" aria-hidden="true"></span>
                <span class="upgrade-page__brand-name">Sonar</span>
            </div>
            <button class="upgrade-page__back" type="button" data-action="back-to-app">
                Back to app
            </button>
        </header>

        <div class="upgrade-page__hero">
            <h1 class="upgrade-page__heading">Upgrade Your Reading Experience</h1>
            <p class="upgrade-page__subheading">
                Ditch the screen. Turn your reading list into an immersive podcast feed natively.
            </p>
            <p class="upgrade-page__payment-note">
                Powered by Paystack. Secure processing guaranteed.
                <br />
                <button class="upgrade-page__cancel-link" type="button" data-action="cancel-subscription-info">
                    Cancel subscription anytime in settings.
                </button>
            </p>
        </div>

        <div class="upgrade-page__plans" id="upgrade-page-plans-slot">
            <!-- plan cards injected by app.js from state.plans -->
        </div>
    </div>

    <!-- ======================================================================
         ONBOARDING — shown before the app shell on first run. Own top-level
         container (not part of app-shell) since there's no file-nav to
         anchor to yet. app.js toggles which of these two roots is visible.
         ====================================================================== -->
    <div class="onboarding-root" id="onboarding-root">
        <div id="onboarding-step-slot" data-slot="onboarding-step"></div>
    </div>

    <!-- ======================================================================
         APP SHELL — persistent slots. file-nav-slot mounts once and is never
         re-rendered. main-slot / player-panel-slot / mini-player-slot swap
         based on app state (see app.js).
         ====================================================================== -->
    <div class="app-shell" id="app-shell">
        <div id="file-nav-slot" data-slot="file-nav"></div>
        <div id="main-slot" data-slot="main"></div>
        <div id="player-panel-slot" data-slot="player-panel"></div>
        <div id="mini-player-slot" data-slot="mini-player"></div>
    </div>

    <div id="modal-slot"></div>

    <!-- ======================================================================
         UPGRADE PAGE TEMPLATES
         ====================================================================== -->

    <!-- ---------- PLAN CARD (reused for both Free and Pro) ---------- -->
    <template id="tpl-plan-card">
        <article class="plan-card" data-plan="">
            <div class="plan-card__header">
                <h2 class="plan-card__name" data-bind="planName"></h2>
                <span class="plan-card__badge" data-bind="planBadge"></span>
            </div>

            <p class="plan-card__price">
                <span class="plan-card__price-amount" data-bind="priceAmount"></span>
                <span class="plan-card__price-period" data-bind="pricePeriod"></span>
            </p>

            <p class="plan-card__description" data-bind="planDescription"></p>

            <hr class="plan-card__divider" />

            <ul class="plan-card__feature-list" data-list="features">
                <!-- feature items injected by app.js -->
            </ul>

            <button class="plan-card__cta" type="button" data-action="plan-cta"></button>
        </article>
    </template>

    <!-- ---------- FEATURE LIST ITEM (cloned per feature into a plan card) ---------- -->
    <template id="tpl-plan-feature">
        <li class="plan-card__feature">
            <span class="plan-card__feature-icon" aria-hidden="true"></span>
            <span class="plan-card__feature-text" data-bind="featureText"></span>
        </li>
    </template>

    <!-- ======================================================================
         ONBOARDING TEMPLATES
         ====================================================================== -->

    <!-- ---------- STEP 1: PREFERENCES (name + voice gender + accent + brand color, combined) ---------- -->
    <template id="tpl-onboarding-preferences">
        <div class="onboarding-split">
            <section class="onboarding-step" data-step="preferences">
                <div class="onboarding-step__brand">
                    <span class="onboarding-step__brand-logo" aria-hidden="true">
                        <svg width="42" height="42" viewBox="0 0 42 43" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect width="42" height="43" rx="21" fill="url(#paint-logo-onboarding-prefs)" />
                            <path
                                d="M9.33203 19.1667V22.6667M13.9991 14.5V27.3333M18.6661 11V32M23.3332 16.8333V25M28.0002 13.3333V28.5M32.6672 19.1667V22.6667"
                                stroke="#F8FAFC" stroke-width="2" stroke-linecap="round" />
                            <defs>
                                <linearGradient id="paint-logo-onboarding-prefs" x1="0" y1="0" x2="42" y2="0"
                                    gradientUnits="userSpaceOnUse">
                                    <stop stop-color="#3B82F6" />
                                    <stop offset="1" stop-color="#9333EA" />
                                </linearGradient>
                            </defs>
                        </svg>
                    </span>
                    <span class="onboarding-step__brand-name">Sonar</span>
                </div>

                <h1 class="onboarding-step__heading">Preferences</h1>
                <p class="onboarding-step__subheading">Customize your experience</p>

                <div class="onboarding-step__field">
                    <label class="onboarding-step__label" for="onboarding-name-input">What would you like to be
                        called?</label>
                    <input class="onboarding-step__input" type="text" id="onboarding-name-input"
                        placeholder="Enter your preferred name" data-bind="nameInput" />
                </div>

                <div class="onboarding-step__field">
                    <span class="onboarding-step__label">Choose your voice model</span>
                    <p class="onboarding-step__field-hint">Choose a voice and accent to personalize your experience.</p>
                    <div class="onboarding-step__pill-group" data-group="voiceGender">
                        <button type="button" class="onboarding-step__pill" data-value="male"
                            data-bind="voiceGenderMale">
                            <span class="onboarding-step__pill-label">Male</span>
                            <span class="onboarding-step__pill-check" aria-hidden="true"></span>
                        </button>
                        <button type="button" class="onboarding-step__pill" data-value="female"
                            data-bind="voiceGenderFemale">
                            <span class="onboarding-step__pill-label">Female</span>
                            <span class="onboarding-step__pill-check" aria-hidden="true"></span>
                        </button>
                    </div>
                </div>

                <div class="onboarding-step__field">
                    <span class="onboarding-step__label">Select Accent</span>
                    <div class="onboarding-step__accent-group" data-group="accent">
                        <!-- accent cards injected by app.js from ACCENT_OPTIONS -->
                    </div>
                </div>

                <div class="onboarding-step__field">
                    <span class="onboarding-step__label">Brand color</span>
                    <p class="onboarding-step__field-hint">Select your brand color</p>
                    <div class="onboarding-step__swatch-group" data-group="accentColor">
                        <!-- swatch buttons injected by app.js from ACCENT_COLOR_OPTIONS -->
                    </div>
                </div>

                <div class="onboarding-step__actions">
                    <button class="onboarding-step__button onboarding-step__button--primary" type="button"
                        data-action="next">
                        Continue
                    </button>
                </div>
            </section>

            <aside class="onboarding-visual" aria-hidden="true">
                <div class="onboarding-visual__orb-wrap">
                    <video src="./assets/orb/orb-2.webm" autoplay loop muted width="220" height="220"></video>
                </div>
            </aside>
        </div>
    </template>

    <!-- ---------- ACCENT COLOR SWATCH (cloned per option) ---------- -->
    <template id="tpl-onboarding-swatch">
        <button class="onboarding-step__swatch" type="button" data-bind="swatchValue"></button>
    </template>

    <!-- ---------- ACCENT CARD (cloned per accent option) ---------- -->
    <template id="tpl-onboarding-accent-card">
        <button type="button" class="onboarding-step__accent-card">
            <span class="onboarding-step__accent-card-top">
                <span class="onboarding-step__accent-flag" data-bind="accentFlag"></span>
                <span class="onboarding-step__accent-check" aria-hidden="true"></span>
            </span>
            <span class="onboarding-step__accent-name" data-bind="accentName"></span>
            <span class="onboarding-step__accent-meta">Accent</span>
        </button>
    </template>



    <template id="tpl-onboarding-license">
        <div class="onboarding-split">
            <section class="onboarding-step" data-step="license">
                <div class="onboarding-step__brand">
                    <span class="onboarding-step__brand-logo" aria-hidden="true">
                        <svg width="42" height="42" viewBox="0 0 42 43" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect width="42" height="43" rx="21" fill="url(#paint-logo-onboarding-license)" />
                            <path
                                d="M9.33203 19.1667V22.6667M13.9991 14.5V27.3333M18.6661 11V32M23.3332 16.8333V25M28.0002 13.3333V28.5M32.6672 19.1667V22.6667"
                                stroke="#F8FAFC" stroke-width="2" stroke-linecap="round" />
                            <defs>
                                <linearGradient id="paint-logo-onboarding-license" x1="0" y1="0" x2="42" y2="0"
                                    gradientUnits="userSpaceOnUse">
                                    <stop stop-color="#3B82F6" />
                                    <stop offset="1" stop-color="#9333EA" />
                                </linearGradient>
                            </defs>
                        </svg>
                    </span>
                    <span class="onboarding-step__brand-name">Sonar</span>
                </div>

                <p class="onboarding-step__progress">Step 3 of 3</p>

                <h1 class="onboarding-step__heading">Activate Pro?</h1>
                <p class="onboarding-step__subheading">
                    If you have a Sonar Pro license, activate it now. Otherwise, continue with the free plan —
                    you can activate later from settings.
                </p>

                <div class="onboarding-step__field">
                    <label class="onboarding-step__label" for="onboarding-license-input">License file</label>
                    <div class="onboarding-step__file-row">
                        <input class="onboarding-step__input" type="text" id="onboarding-license-input"
                            placeholder="No file selected" readonly data-bind="licensePathDisplay" />
                        <button class="onboarding-step__button" type="button"
                            data-action="browse-license">Browse</button>
                    </div>
                    <p class="onboarding-step__field-status" data-bind="licenseStatus" data-state=""></p>
                </div>

                <div class="onboarding-step__actions onboarding-step__actions--license">
                    <button class="onboarding-step__button onboarding-step__button--secondary" type="button"
                        data-action="back">Back</button>
                    <button class="onboarding-step__button onboarding-step__button--secondary" type="button"
                        data-action="skip">Skip, continue free</button>
                    <button class="onboarding-step__button onboarding-step__button--primary" type="button"
                        data-action="activate-and-finish">
                        Activate &amp; finish
                    </button>
                </div>
            </section>

            <aside class="onboarding-visual" aria-hidden="true">
                <div class="onboarding-visual__orb-wrap">
                    <video src="./assets/orb/orb-2.webm" autoplay loop muted width="220" height="220"></video>
                </div>
            </aside>
        </div>
    </template>

    <!-- ======================================================================
         MAIN APP TEMPLATES
         ====================================================================== -->

    <!-- ---------- FILE NAV (shared, identical on every screen) ---------- -->
    <template id="tpl-file-nav">
        <aside class="file-nav">
            <div class="file-nav__brand">
                <span class="file-nav__logo" aria-hidden="true">
                    <svg width="30" height="30" viewBox="0 0 42 43" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="42" height="43" rx="21" fill="url(#paint-logo-filenav)" />
                        <path
                            d="M9.33203 19.1667V22.6667M13.9991 14.5V27.3333M18.6661 11V32M23.3332 16.8333V25M28.0002 13.3333V28.5M32.6672 19.1667V22.6667"
                            stroke="#F8FAFC" stroke-width="2" stroke-linecap="round" />
                        <defs>
                            <linearGradient id="paint-logo-filenav" x1="0" y1="0" x2="42" y2="0"
                                gradientUnits="userSpaceOnUse">
                                <stop stop-color="#3B82F6" />
                                <stop offset="1" stop-color="#9333EA" />
                            </linearGradient>
                        </defs>
                    </svg>
                </span>
                <span class="file-nav__name">Sonar</span>
                <button class="file-nav__pin-toggle" type="button" aria-label="Pin sidebar open">
                    <span class="file-nav__pin-icon" aria-hidden="true"></span>
                </button>
            </div>

            <div class="file-nav__search">
                <input type="search" class="file-nav__search-input" placeholder="Search files..." />
            </div>

            <button class="file-nav__new-file" type="button" data-action="new-file">
                <span class="file-nav__new-file-icon" aria-hidden="true">
                    <svg width="12" height="11" viewBox="0 0 12 11" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 10V5.5M6 5.5V1M6 5.5H11M6 5.5H1" stroke="#94A3B8" stroke-width="2"
                            stroke-linecap="round" />
                    </svg>

                </span>
                <span class="file-nav__new-file-label">New file</span>
            </button>

            <nav class="file-nav__section" aria-label="Pinned files">
                <h2 class="file-nav__section-label">Pinned</h2>
                <ul class="file-nav__list" data-list="pinned">
                    <!-- file items injected by app.js from state.pinnedFiles -->
                </ul>
            </nav>

            <nav class="file-nav__section" aria-label="Recent files">
                <h2 class="file-nav__section-label">Recents</h2>
                <ul class="file-nav__list" data-list="recents">
                    <!-- file items injected by app.js from state.recentFiles -->
                </ul>
            </nav>

            <!-- ADD inside tpl-file-nav, right after the Recents <nav> block, before .file-nav__footer -->
            <nav class="file-nav__section" aria-label="Search results" data-section="search-results"
                style="display: none;">
                <h2 class="file-nav__section-label">Search Results</h2>
                <ul class="file-nav__list" data-list="search-results">
                    <!-- search result items injected by app.js, or "no results" message -->
                </ul>
            </nav>

            <div class="file-nav__footer">
                <button class="file-nav__upgrade" type="button" data-tier="pro-upsell" data-action="upgrade-to-pro">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <g clip-path="url(#clip0_356_2098)">
                            <path
                                d="M11.6673 1.16715V3.5004M12.8341 2.33378H10.5005M6.42678 1.64223C6.45177 1.50842 6.52279 1.38756 6.62752 1.30059C6.73225 1.21362 6.8641 1.16602 7.00024 1.16602C7.13638 1.16602 7.26823 1.21362 7.37296 1.30059C7.47769 1.38756 7.54871 1.50842 7.5737 1.64223L8.18684 4.88427C8.23038 5.11476 8.34241 5.32678 8.50829 5.49264C8.67418 5.65851 8.88622 5.77052 9.11674 5.81406L12.3592 6.42712C12.493 6.45212 12.6139 6.52312 12.7008 6.62784C12.7878 6.73256 12.8354 6.86439 12.8354 7.00052C12.8354 7.13664 12.7878 7.26848 12.7008 7.37319C12.6139 7.47791 12.493 7.54892 12.3592 7.57391L9.11674 8.18697C8.88622 8.23051 8.67418 8.34252 8.50829 8.50839C8.34241 8.67426 8.23038 8.88627 8.18684 9.11677L7.5737 12.3588C7.54871 12.4926 7.47769 12.6135 7.37296 12.7004C7.26823 12.7874 7.13638 12.835 7.00024 12.835C6.8641 12.835 6.73225 12.7874 6.62752 12.7004C6.52279 12.6135 6.45177 12.4926 6.42678 12.3588L5.81364 9.11677C5.7701 8.88627 5.65807 8.67426 5.49218 8.50839C5.3263 8.34252 5.11426 8.23051 4.88374 8.18697L1.64131 7.57391C1.50748 7.54892 1.38661 7.47791 1.29963 7.37319C1.21265 7.26848 1.16504 7.13664 1.16504 7.00052C1.16504 6.86439 1.21265 6.73256 1.29963 6.62784C1.38661 6.52312 1.50748 6.45212 1.64131 6.42712L4.88374 5.81406C5.11426 5.77052 5.3263 5.65851 5.49218 5.49264C5.65807 5.32678 5.7701 5.11476 5.81364 4.88427L6.42678 1.64223ZM3.49998 11.6667C3.49998 12.311 2.97761 12.8334 2.33322 12.8334C1.68884 12.8334 1.16646 12.311 1.16646 11.6667C1.16646 11.0224 1.68884 10.5001 2.33322 10.5001C2.97761 10.5001 3.49998 11.0224 3.49998 11.6667Z"
                                stroke="#F8FAFC" stroke-width="2" stroke-linecap="round" />
                        </g>
                        <defs>
                            <clipPath id="clip0_356_2098">
                                <rect width="14" height="14" fill="white" />
                            </clipPath>
                        </defs>
                    </svg>

                    <span class="file-nav__upgrade-label">Upgrade to Pro</span>
                </button>

                <div class="file-nav__account">
                    <span class="file-nav__avatar" aria-hidden="true"></span>
                    <div class="file-nav__account-info">
                        <span class="file-nav__account-name" data-bind="accountName">Alexander Chen</span>
                        <span class="file-nav__account-email" data-bind="accountPlan">Free</span>
                    </div>
                    <button class="file-nav__settings" type="button" aria-label="Settings">
                        <span class="file-nav__settings-icon" aria-hidden="true">
                            <svg width="19" height="18" viewBox="0 0 19 18" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M12.0994 8.62443C12.0994 10.2853 10.7675 11.6317 9.12441 11.6317C7.48136 11.6317 6.14941 10.2853 6.14941 8.62443C6.14941 6.96357 7.48136 5.61719 9.12441 5.61719C10.7675 5.61719 12.0994 6.96357 12.0994 8.62443Z"

                                    stroke="#94A3B8" stroke-width="1.25" stroke-linecap="round" />
                            </svg>

                        </span>
                    </button>
                </div>
            </div>
        </aside>
    </template>

    <!-- ---------- FILE NAV LIST ITEM (cloned per file into the lists above) ---------- -->
    <!-- ---------- FILE NAV LIST ITEM (Pinned) ---------- -->
    <template id="tpl-file-nav-item">
        <li class="file-nav__item">
            <button class="file-nav__item-button" type="button">
                <span class="file-nav__item-icon" aria-hidden="true">
                    <svg class="h-3.5 w-3.5 shrink-0 text-gray-400" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 17v5"></path>
                        <path
                            d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 0-1-1H10a1 1 0 0 0-1 1z">
                        </path>
                    </svg>
                </span>
                <span class="file-nav__item-name" data-bind="fileName"></span>
            </button>

                                <span class="onboarding-step__pill-check" aria-hidden="true"></span>
                            </button>
                            <button type="button" class="onboarding-step__pill" data-value="female"
                                data-bind="settingsVoiceGenderFemale">
                                <span class="onboarding-step__pill-label">Female</span>
                                <span class="onboarding-step__pill-check" aria-hidden="true"></span>
                            </button>
                        </div>
                    </div>

                    <div class="settings-modal__field">
                        <span class="onboarding-step__label">Select Accent</span>
                        <div class="onboarding-step__accent-group" data-group="settingsAccent"></div>
